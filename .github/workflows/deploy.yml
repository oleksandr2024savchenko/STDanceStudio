name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Repos namens "<owner>.github.io" liegen im Wurzelpfad, alle anderen in einem Unterpfad.
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            export NEXT_PUBLIC_BASE_PATH=""
            export NEXT_PUBLIC_SITE_URL="https://$OWNER_LC.github.io"
          else
            export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME"
            export NEXT_PUBLIC_SITE_URL="https://$OWNER_LC.github.io/$REPO_NAME"
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
